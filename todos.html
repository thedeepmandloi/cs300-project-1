<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="styles/styles.css"
    />
    <title>Todo</title>
  </head>
  <body class="light-mode">
    <!-- <button id="light-mode">Dark Mode</button>
    <button id="dark-mode">Light Mode</button> -->
    <h1>Todo List</h1>
    <h1>All todo lists:</h1>
    <div
      id="count"
      style="width: 100%; height: 100px; background-color: red"
    >
      <div>
        <button id="test-todo">Add Todo</button>
      </div>
    </div>

    <div>
      <form action="">
        <input
          type="text"
          id="todo-input"
          name="todo"
          placeholder="Enter a new todo"
        />
        <button
          type="submit"
          id="add-todo"
        >
          Add Todo
        </button>
      </form>
    </div>

    <!-- <div id="todo-list"></div> -->
    <script src="scripts/index.js"></script>
  </body>
</html>
