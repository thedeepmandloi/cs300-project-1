<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="styles/tasks.css"
    />
    <script
      src="scripts/tasks.js"
      defer
    ></script>

    <title>Tasks</title>
  </head>
  <body>
    <main>
      <h1>Task List</h1>

      <div class="add-section">
        <input
          type="text"
          id="task-input"
          placeholder="Enter a new task..."
        />
        <button id="add-btn">Add</button>
      </div>

      <div id="task-list">
        <div class="task-item">
          <span>Buy groceries</span>
          <button class="delete-btn">Delete</button>
        </div>
        <div class="task-item">
          <span>Finish GP1</span>
          <button class="delete-btn">Delete</button>
        </div>
      </div>
    </main>
  </body>
</html>
